[project]
name = "body3d"
version = "0.1.0"
description = "Landmark detection and body-shape change on synthetic 3D body scans (Anny body model, simulated turntable scanner)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anny==0.6.1",
    "torch==2.14.1",
    "numpy>=2.3",
    "scipy>=1.14",
    "trimesh>=4.5",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.0",
    "pytest>=8",
    "rtree>=1.3",
]
qa = [
    "anthropic>=1.0",
    "open-clip-torch>=3.0",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/body3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Only resolve releases at least two weeks old at the time the qa group was added.
exclude-newer = "2026-10-25T00:00:00Z"
